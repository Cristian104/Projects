services:
  mybrain:
    build: .
    container_name: mybrain
    restart: "no"
    ports:
      - "127.0.0.1:5000:5000"  # Cloudflare proxies directly to this port
    volumes:
      - ./app:/app/app            # Live code mount (no rebuild needed for template/Python changes)
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket for container discovery
    env_file:
      - .env  # <--- Loads TELEGRAM_BOT_TOKEN, CHAT_ID, etc. securely
    environment:
      - TZ=Europe/Warsaw
      - ENABLE_BOT=true
    networks:
      - stacks-net
      - default

networks:
  stacks-net:
    external: true