<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBrain | Access</title>
    <link rel="icon" type="image/png" sizes="192x192"
      href="{{ url_for('static', filename='global/img/favicon-192.png') }}" />

    <!-- Fonts: Space Grotesk + Archivo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='global/css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='global/css/components.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='auth/css/login.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile/css/login.css') }}" />

    <style>
      :root {
        --bg: #0F172A;
        --surface: #1E293B;
        --surface-input: #0F172A;
        --accent: #22C55E;
        --accent-dim: rgba(34,197,94,0.1);
        --accent-border: rgba(34,197,94,0.25);
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --border-subtle: rgba(255,255,255,0.07);
        --border-medium: rgba(255,255,255,0.12);
        --danger: #EF4444;
        --r-md: 10px;
        --r-lg: 14px;
        --r-xl: 18px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--text-primary);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* ── Split Screen ─────────────────────────────────────────── */
      .split-screen {
        display: flex;
        min-height: 100vh;
      }

      /* ── Left Pane ────────────────────────────────────────────── */
      .left-pane {
        flex: 1;
        position: relative;
        background: #050D1A;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 300px;
      }

      /* CSS animated rings background */
      .anim-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(34, 197, 94, 0.12);
        animation: pulse-ring 6s ease-out infinite;
      }

      .ring-1 { width: 280px; height: 280px; top: 25%; left: 35%; animation-delay: 0s; }
      .ring-2 { width: 480px; height: 480px; top: 12%; left: 18%; animation-delay: 2s; }
      .ring-3 { width: 680px; height: 680px; top: -5%; left: 2%; animation-delay: 4s; }
      .ring-4 { width: 180px; height: 180px; top: 60%; left: 55%; animation-delay: 1s; }
      .ring-5 { width: 360px; height: 360px; top: 50%; left: 40%; animation-delay: 3s; }

      .glow-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        animation: float-glow 8s ease-in-out infinite;
      }

      .glow-blob-1 {
        width: 350px; height: 350px;
        background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, transparent 70%);
        top: 20%; left: 25%;
        animation-delay: 0s;
      }

      .glow-blob-2 {
        width: 250px; height: 250px;
        background: radial-gradient(circle, rgba(34,197,94,0.07) 0%, transparent 70%);
        top: 55%; left: 55%;
        animation-delay: 3s;
      }

      /* Grid overlay for tech feel */
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.7); opacity: 0; }
        30% { opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
      }

      @keyframes float-glow {
        0%, 100% { transform: translate(0, 0); }
        33% { transform: translate(25px, -20px); }
        66% { transform: translate(-15px, 25px); }
      }

      .left-pane .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(5,13,26,0.3) 0%,
          rgba(5,13,26,0.1) 50%,
          rgba(5,13,26,0.6) 100%
        );
        z-index: 1;
      }

      .carousel-container {
        position: relative;
        z-index: 2;
        padding: 48px;
        width: 100%;
        max-width: 520px;
      }

      /* Top brand badge on left pane */
      .left-brand {
        position: absolute;
        top: 28px;
        left: 32px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .left-brand img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      .left-brand span {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.7);
      }

      .quote-icon {
        width: 36px;
        height: 36px;
        color: var(--accent);
        margin-bottom: 16px;
        opacity: 0.8;
      }

      .quote-text {
        font-family: 'Archivo', sans-serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.55;
        margin-bottom: 14px;
        max-width: 420px;
      }

      .quote-author {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      #quote-author {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent);
      }

      #quote-role {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .carousel-dots {
        display: flex;
        gap: 6px;
        margin-top: 20px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.3);
        transition: background 0.2s;
      }

      .dot.active {
        background: var(--accent);
        width: 20px;
        border-radius: 3px;
      }

      /* ── Right Pane ───────────────────────────────────────────── */
      .right-pane {
        width: 440px;
        flex-shrink: 0;
        background: var(--surface);
        border-left: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 40px;
      }

      .login-box {
        width: 100%;
        max-width: 360px;
      }

      .login-box h1 {
        font-family: 'Archivo', sans-serif;
        font-size: 1.7rem;
        font-weight: 900;
        color: var(--text-primary);
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .sub-header {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .sub-header a {
        color: var(--accent);
        text-decoration: none;
      }

      .sub-header a:hover { text-decoration: underline; }

      /* ── Form ─────────────────────────────────────────────────── */
      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 7px;
      }

      .input-group input {
        width: 100%;
        background: var(--surface-input);
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-md);
        padding: 11px 14px;
        color: var(--text-primary);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.15s;
      }

      .input-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34,197,94,0.08);
      }

      .input-group input::placeholder { color: var(--text-muted); }

      .btn-primary {
        width: 100%;
        background: var(--accent);
        color: #0F172A;
        border: none;
        border-radius: var(--r-md);
        padding: 12px 20px;
        font-weight: 700;
        font-size: 0.95rem;
        font-family: 'Space Grotesk', sans-serif;
        cursor: pointer;
        transition: opacity 0.15s;
        margin-top: 4px;
        letter-spacing: 0.01em;
      }

      .btn-primary:hover { opacity: 0.88; }

      .footer-link {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: center;
        margin-top: 20px;
      }

      .footer-link a {
        color: var(--accent);
        text-decoration: none;
      }

      .footer-link a:hover { text-decoration: underline; }

      .flash-error {
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.3);
        color: #FCA5A5;
        border-radius: var(--r-md);
        padding: 10px 14px;
        font-size: 0.85rem;
        margin-top: 16px;
      }

      /* ── MyBrain Logo Mark ────────────────────────────────────── */
      .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        background: var(--accent-dim);
        border: 1px solid var(--accent-border);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 1rem;
      }

      .brand-name {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--text-primary);
      }

      /* ── Responsive ───────────────────────────────────────────── */
      @media (max-width: 768px) {
        .split-screen { flex-direction: column; }
        .left-pane { min-height: 220px; flex: none; }
        .right-pane { width: 100%; border-left: none; border-top: 1px solid var(--border-subtle); padding: 36px 24px; }
      }
    </style>
  </head>

  <body>
    <div class="split-screen">
      <!-- Left: animated background + quote carousel -->
      <div class="left-pane">
        <!-- Top-left brand badge -->
        <div class="left-brand">
          <img src="{{ url_for('static', filename='global/img/mybrain-logo.png') }}" alt="MyBrain" />
          <span>MyBrain</span>
        </div>

        <div class="anim-bg">
          <div class="grid-overlay"></div>
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
          <div class="ring ring-4"></div>
          <div class="ring ring-5"></div>
          <div class="glow-blob glow-blob-1"></div>
          <div class="glow-blob glow-blob-2"></div>
        </div>
        <div class="overlay"></div>

        <div class="carousel-container">
          <div class="quote-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
              <path d="M14.017 21L14.017 18C14.017 16.8954 14.9124 16 16.017 16H19.017C19.5693 16 20.017 15.5523 20.017 15V9C20.017 8.44772 19.5693 8 19.017 8H15.017C14.4647 8 14.017 8.44772 14.017 9V11C14.017 11.5523 13.5693 12 13.017 12H12.017V5H22.017V15C22.017 18.3137 19.3307 21 16.017 21H14.017ZM5.01697 21L5.01697 18C5.01697 16.8954 5.9124 16 7.01697 16H10.017C10.5693 16 11.017 15.5523 11.017 15V9C11.017 8.44772 10.5693 8 10.017 8H6.01697C5.46468 8 5.01697 8.44772 5.01697 9V11C5.01697 11.5523 4.56925 12 4.01697 12H3.01697V5H13.017V15C13.017 18.3137 10.3307 21 7.01697 21H5.01697Z"></path>
            </svg>
          </div>

          <div class="carousel-content">
            <p class="quote-text" id="quote-text">Loading wisdom...</p>
            <div class="quote-author">
              <span id="quote-author"></span>
              <span id="quote-role"></span>
            </div>
          </div>

          <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>

      <!-- Right: login form -->
      <div class="right-pane">
        <div class="login-box">
          <div class="brand-mark">
            <img src="{{ url_for('static', filename='global/img/mybrain-logo.png') }}" alt="MyBrain"
              style="width:36px; height:36px; border-radius:9px; flex-shrink:0;" />
            <span class="brand-name">MyBrain</span>
          </div>

          <h1>Welcome back</h1>
          <p class="sub-header">
            Don't have an account? <a href="#">Click here</a>
          </p>

          <form method="POST">
            <div class="input-group">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="off"
                placeholder="Enter username"
              />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required placeholder="••••••••" />
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
          </form>

          <p class="footer-link">
            Forgot your password? <a href="#">Click here</a>
          </p>

          {% with messages = get_flashed_messages() %} {% if messages %}
          <div class="flash-error">{{ messages[0] }}</div>
          {% endif %} {% endwith %}
        </div>
      </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="{{ url_for('static', filename='auth/js/login.js') }}"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script
      type="module"
      src="{{ url_for('static', filename='auth/js/fluid.js') }}"
    ></script>
  </body>
</html>
