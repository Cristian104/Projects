    - Trading Bot:
      - Overview: trading-bot/overview.md
      - Architecture: trading-bot/architecture.md
      - Operations: trading-bot/operations.md
      - T212 API: trading-bot/t212-api.md
      - Changelog: trading-bot/changelog.md
      - V2.2 Release Notes: trading-bot/v2-2-release.md
      - Trading Concepts (Plain English): trading-bot/trading-concepts.md
      - Components:
