site_name: My Brain — Knowledge Base
site_author: Jorg
site_description: Central documentation for all infrastructure, bots, and services

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate
  palette:
    scheme: slate
    primary: green
    accent: light green
  font:
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Infrastructure:
    - Overview: infrastructure/overview.md
    - VPS & Services: infrastructure/vps.md
    - Docker Services: infrastructure/docker.md
    - Cloudflare Tunnels: infrastructure/tunnels.md
    - Backups: infrastructure/backups.md

  - Security:
    - Overview: security/overview.md
    - SSH Hardening: security/ssh.md
    - Firewall: security/firewall.md
    - Cloudflare Zero Trust: security/cloudflare-zt.md
    - fail2ban: security/fail2ban.md

  - Services:
    - MyBrain Portal:
      - Overview: mybrain/overview.md
      - Modules: mybrain/modules.md
      - Gym Module: mybrain/gym.md
      - Nutrition Module: mybrain/nutrition.md
      - Development: mybrain/development.md
    - OpenClaw & Agents:
