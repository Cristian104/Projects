[project]
name = "remastered-bot"
version = "0.1.0"
description = "High-Perf Trading Bot"
authors = [
    {name = "Jorg", email = "crisestrada.med@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "feedparser (>=6.0.12,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "yfinance (>=1.1.0,<2.0.0)",
    "pandas (<3.0.0)",
"aiohttp (>=3.13.3,<4.0.0)",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "tqdm (>=4.67.3,<5.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "rich>=13.0.0",
    "google-genai>=1.0.0",
]

[tool.poetry]
package-mode = false
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
